# 融销通 · 单机容器编排
#
#   docker compose up -d --build      # 起全套（MySQL + 后端 + Nginx/静态站点）
#   浏览器打开 http://localhost:8088/
#   docker compose down               # 停掉（数据保留在卷里）
#   docker compose down -v            # 连数据库一起清掉，下次 up 会重新灌演示数据
#
# 三个容器：
#   web      Nginx：/ 落地页、/app/ 业务端、/admin/ 管理后台、/api/ 反代后端
#   backend  后端服务（Spring Boot，profile=docker）
#   mysql    数据库，首次启动自动灌 schema.sql + data.sql
#
# 与本地开发（scripts/demo-start.sh）的区别：本地开发跑的是三个 vite dev server
# 加一个 mvn 进程，改代码即时热更新；这里是构建产物 + 单端口入口，用来验证
# 部署形态本身。两个都跑着也行，端口不冲突（这里对外是 8088）。

name: rxt

services:
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${RXT_DB_PASSWORD:-root}
      MYSQL_DATABASE: rxt
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # ⚠️ 挂载名必须带序号前缀。
      # MySQL 官方镜像按**文件名字典序**执行 initdb.d 下的脚本，而 "data.sql"
      # 排在 "schema.sql" 前面 —— 原名挂进去会先跑 data.sql，第一条 INSERT
      # 就报「表不存在」。README 里专门警告过这个顺序，容器里同样适用。
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      # 不能用 mysqladmin ping：那只表示"进程活着"，而 initdb.d 的脚本是在
      # mysqld 起来之后才执行的 —— 用 ping 做判据的话，数据库会在 data.sql
      # 还在跑的时候就被判定为"健康"，后端随即启动、然后因为表不存在而挂掉。
      # 这里直接查演示账号在不在，能真正确认「结构 + 数据都灌完了」。
      test:
        - CMD-SHELL
        - mysql -h127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} -N -e 'SELECT COUNT(*) FROM rxt.t_user' 2>/dev/null | grep -qv '^0$$'
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 40s

  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        # 等健康检查通过再起，避免"后端先起来、连不上库直接退出"
        condition: service_healthy
    environment:
      RXT_DB_URL: jdbc:mysql://mysql:3306/rxt?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      RXT_DB_USERNAME: root
      RXT_DB_PASSWORD: ${RXT_DB_PASSWORD:-root}
      # ⚠️ 只要这个地址会被本机以外的人访问到，就必须换成随机长密钥：
      #     RXT_JWT_SECRET=$(openssl rand -base64 48) docker compose up -d
      # 不设置的话用的是 application-docker.yml 里那个写在版本库里的默认值，
      # 等于任何人都能自己签发一个合法的登录 token。
      RXT_JWT_SECRET: ${RXT_JWT_SECRET:-}
      # 接口文档默认关。要演示 Swagger 时：RXT_API_DOCS_ENABLED=true docker compose up -d
      RXT_API_DOCS_ENABLED: ${RXT_API_DOCS_ENABLED:-false}
      TZ: Asia/Shanghai
    volumes:
      # OBS 未启用时上传产物写在容器的 /app/uploads。用卷挂出来，
      # 否则 docker compose down 一次，所有上传的图片就没了
      # （数据库里的记录还在，页面上全是破图，很难查）。
      - uploads:/app/uploads

  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # 对外用 8088 而不是 80：本机开发时 8080（后端）、5173/5174（前端）都占着，
      # 换个不冲突的端口最省事。要占 80 就 RXT_HTTP_PORT=80 docker compose up -d。
      - "${RXT_HTTP_PORT:-8088}:80"

volumes:
  mysql-data:
  uploads:
