server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: rxt-backend
  profiles:
    active: dev
    #
    # ★ 2026-10-12 补：让 application-local.yml 真的会被加载。
    #
    # 改前只有 `active: dev`，而 application-dev.yml 又没有 include local ——
    # 于是 application.yml 里那句「密钥可改用 application-local.yml 注入」是**空头承诺**：
    # 文件建了也不会被读，密钥不生效，排查起来毫无线索（文件在、名字对、就是不生效）。
    #
    # 用 include 而不是把它塞进 `active`：include 是**追加**语义，
    # 别人若用 SPRING_PROFILES_ACTIVE 覆盖 active，local 依然会在。
    #
    # local 这个 profile 不存在对应文件时，Spring 只是找不到配置、不会报错，
    # 所以对没建该文件的队友完全无影响。
    include: local
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.rxt.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

rxt:
  jwt:
    # 生产环境务必替换为随机长密钥（不少于 32 字节），并通过环境变量注入
    secret: rxt-platform-dev-secret-key-please-change-in-production
    expire-hours: 24
  obs:
    # 华为云对象存储，承载商品图片 / 知识配图 / 用户头像
    #
    # ★ 开关也走环境变量（默认 false），理由与下面密钥一致：
    #   仓库里保持"clone 下来就能跑"——队友没有 AK/SK 也能起后端、走本地磁盘。
    #   要启用 OBS 时在启动前 export RXT_OBS_ENABLED=true 即可，不必改这个文件。
    #   （OS 环境变量的优先级高于任何 application*.yml，见 application-dev.yml 的同类说明）
    #
    # false = 文件写本地磁盘（默认，无需密钥即可跑通上传链路）
    # true  = 转存 OBS，启动时会强校验 endpoint / bucket / access-key / secret-key，
    #         缺任何一个**直接启动失败**（这是有意设计：让配置问题在部署阶段暴露，
    #         而不是等演示到一半用户传图时才报错）
    enabled: ${RXT_OBS_ENABLED:false}
    endpoint: obs.cn-north-4.myhuaweicloud.com
    bucket: rxt-oss
    #
    # ★ 密钥不进版本库（《概要设计说明书》§8.3）：这里只声明**变量名**，值一律留空。
    #   改前是字面量 `access-key: ""`，注释虽说"用环境变量注入"，
    #   但全仓没有任何地方写出这两个变量该叫什么名字 —— 等于说了方法没给钥匙孔。
    #   改成占位符后名字就定死了，也省得去猜 Spring 的 relaxed binding 会怎么映射。
    #
    #   export RXT_OBS_ACCESS_KEY=你的AK
    #   export RXT_OBS_SECRET_KEY=你的SK
    #
    # 冒号后留空 = 未配置时的默认值；enabled=false 时压根不会被读到。
    access-key: ${RXT_OBS_ACCESS_KEY:}
    secret-key: ${RXT_OBS_SECRET_KEY:}
    # 本地兜底存储目录，相对「进程启动时的工作目录」，不是相对 backend 模块：
    #   IDEA 里直接 Run（工作目录 = 项目根）→ <项目根>/uploads
    #   cd backend && mvn spring-boot:run        → backend/uploads
    # 两种落点都在 .gitignore 的 uploads/ 规则覆盖内（该规则不带前导斜杠，匹配任意层级），不会误提交。
    local-dir: uploads

  api-docs:
    # 接口文档（OpenAPI + Swagger UI）总开关。
    # 默认关：它需要把 /v3/api-docs** 与 /swagger-ui** 加进免登录白名单，
    # 等于对外公开完整接口清单和一个可交互调用台，所以不能"默认就开着"。
    # 开发/答辩环境由 application-dev.yml 打开；换到别的 profile 自动不暴露。
    # 临时关闭：RXT_API_DOCS_ENABLED=false mvn spring-boot:run
    enabled: ${RXT_API_DOCS_ENABLED:false}
    title: 融销通（rxt）平台 · 后端接口
    version: 1.0.0

# 接口文档的启停与上面的 rxt.api-docs.enabled 共用同一个值（单一开关）：
# 只关白名单不关端点，会出现「白名单没放行、但端点在」的假死（页面 401）；
# 只关端点不关白名单，白名单里就会长期挂着一条永不命中的规则。
# 两处引用同一个属性，任何一边都不可能单独漂移。
springdoc:
  api-docs:
    enabled: ${rxt.api-docs.enabled}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${rxt.api-docs.enabled}
    path: /swagger-ui.html
    # 标签（= 控制器类名）按字母序、接口按 HTTP 方法排序，页面顺序稳定下来，
    # 才不会每次刷新都在找"刚才那个接口跑哪去了"。
    tags-sorter: alpha
    operations-sorter: method
    # 默认展开第一个接口列表，省掉一次点击；但**不**默认展开具体接口（会把页面撑得很长）。
    doc-expansion: list
    # 把 Authorize 里填的 token 记住，刷新页面后不用重填。
    # 默认 false 时 Swagger UI 既不落盘也不回填（swagger-ui bundle 里
    # persistAuthorizationIfNeeded 直接 return，loaded 钩子也不 restore），
    # 表现为「每次刷新都要重填 token，漏填就一路 401」——排查时极易被误当成
    # Authorize 坏了。只是把 token 存在浏览器本地，不涉及服务端，安全面不变。
    persist-authorization: true

logging:
  level:
    com.rxt: debug
  pattern:
    # 行首的 [traceId] 由 common/TraceIdFilter 写入 MDC。
    # 排查时先按 traceId 过滤，就能把一次请求散落在各层的日志串成一条线；
    # 响应头 X-Trace-Id 带的是同一个值，前端报错可以把它直接甩过来。
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId}] [%thread] %logger{36} - %msg%n"
