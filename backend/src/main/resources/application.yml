server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: rxt-backend
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.rxt.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

rxt:
  jwt:
    # 生产环境务必替换为随机长密钥（不少于 32 字节），并通过环境变量注入
    secret: rxt-platform-dev-secret-key-please-change-in-production
    expire-hours: 24
  obs:
    # 华为云对象存储，承载商品图片 / 知识配图 / 用户头像
    enabled: false
    endpoint: obs.cn-north-4.myhuaweicloud.com
    bucket: rxt-oss
    access-key: ""
    secret-key: ""

logging:
  level:
    com.rxt: debug
  pattern:
    # 行首的 [traceId] 由 common/TraceIdFilter 写入 MDC。
    # 排查时先按 traceId 过滤，就能把一次请求散落在各层的日志串成一条线；
    # 响应头 X-Trace-Id 带的是同一个值，前端报错可以把它直接甩过来。
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId}] [%thread] %logger{36} - %msg%n"
