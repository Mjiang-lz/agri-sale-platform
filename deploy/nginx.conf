# 融销通 · 部署层分流（Nginx）
#
# 三个前端各自构建成静态文件，按路径分流；后端只经 /api/** 暴露。
#
#   /            → 落地页    （frontend-landing）
#   /app/        → 业务端    （frontend-web，构建时 RXT_BASE=/app/）
#   /admin/      → 管理后台  （frontend-admin，构建时 RXT_BASE=/admin/）
#   /api/        → 反代到 backend:8080
#
# 两个容易踩的坑，都写在对应位置：
#   ① 落地页上的「进入平台 / 登录 / 免费入驻」是**构建时**写死的地址，
#      必须用 VITE_PLATFORM_BASE_URL=/app 构建，否则线上这些按钮会指向
#      访问者自己的 localhost:5173。见 deploy/web.Dockerfile。
#   ② 本文件刻意不写正则 location。nginx 的匹配顺序是
#      「精确 = 」>「前缀 ^~」>「正则 ~」>「最长前缀」——
#      一旦写上 `location ~* \.(js|css|png|jpg)$` 这类缓存规则，
#      它会**盖过前缀 location**，把 /api/files/xxx.jpg 也当成静态文件去磁盘上找，
#      结果是上传的图片全部 404，而且只有"有图片的地方"才看得出来。
#      需要缓存的那几个目录一律写成前缀 location，并加 ^~ 把口子封死。

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 上传上限 20MB，与后端 spring.servlet.multipart.max-request-size 对齐。
    # nginx 默认只有 1MB —— 不改的话传图直接 413，而且后端日志里一条都不会有，
    # 很容易被误判成「前端根本没调接口」。
    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ------------------------------------------------------------------
    # 后端 API
    #
    # proxy_pass 后面**不带路径** ⇒ 原始 URI 原样透传。
    # 后端 server.servlet.context-path=/api，所以 /api/xxx 正是它的 /xxx。
    # 写成 proxy_pass http://backend:8080/ （带尾斜杠）会把 /api 前缀替掉，全盘 404。
    # ------------------------------------------------------------------
    location ^~ /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ------------------------------------------------------------------
    # 带内容哈希的构建产物：可以长期强缓存。
    # 文件名里带哈希，内容一变文件名就变，不存在"缓存住了旧版本"的问题。
    # 前缀比 /app/、/admin/ 更长，所以会优先命中。
    # ------------------------------------------------------------------
    location ^~ /assets/       { expires 1y; add_header Cache-Control "public, immutable"; access_log off; }
    location ^~ /app/assets/   { expires 1y; add_header Cache-Control "public, immutable"; access_log off; }
    location ^~ /admin/assets/ { expires 1y; add_header Cache-Control "public, immutable"; access_log off; }

    # ------------------------------------------------------------------
    # 三个 SPA 的入口页：不能缓存。
    # index.html 是最外层那个"壳"，它里面引用的哈希资源每次发版都会换名。
    # 一旦被强缓存，用户会拿着旧壳去请求早已被删掉的旧资源 —— 整页白屏，刷新也没用。
    # 用精确匹配（=）优先级最高，不受上面的前缀规则影响。
    # ------------------------------------------------------------------
    location = /index.html       { add_header Cache-Control "no-cache"; }
    location = /app/index.html   { add_header Cache-Control "no-cache"; }
    location = /admin/index.html { add_header Cache-Control "no-cache"; }

    # ------------------------------------------------------------------
    # 三个 SPA 的路由回退
    # 前端是 history 模式路由，直接访问 /app/trade/products 时磁盘上没有这个文件，
    # 必须回退到各自的 index.html，由前端路由自己解析。
    # ------------------------------------------------------------------
    location ^~ /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location ^~ /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
