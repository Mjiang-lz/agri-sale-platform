# 融销通 · 腾讯云服务器（宝塔面板）这条路在用的 Nginx 配置
#
# 与 deploy/nginx.conf 的关系：
#   deploy/nginx.conf = Docker Compose 那条路（容器里 root 是 /usr/share/nginx/html，
#                       后端是服务名 backend:8080）
#   本文件            = 宝塔这条路（root 是 /www/wwwroot/rxt/www，后端是 127.0.0.1:8081）
#   两者的**分流规则完全一致**，差别只有 root 与后端地址两处。
#
# ★ 服务器上的真实位置：/www/server/panel/vhost/nginx/rxt.conf
#   宝塔主配置 /www/server/nginx/conf/nginx.conf 末尾以
#   `include /www/server/panel/vhost/nginx/*.conf;` 收口，站点配置就放在那个目录里。
#   本文件是**仓库侧的记录版**，与服务器上那份应保持一致 ——
#   改完必须 `nginx -t` 通过后再 `nginx -s reload`。
#
# ★ 为什么不用宝塔的「添加站点」对话框：该版面板对「IP:端口」形式的域名校验过不去
#   （点确定弹「端口范围不合法」）。而本文件是**自包含 server 块**，不 include 宝塔的
#   任何东西，所以直接用宝塔「文件」在 vhost 目录新建 rxt.conf + 粘贴 + 重载即可，
#   完全跳过那个对话框。副作用：该站点不会出现在宝塔「网站」列表里，可接受。
#   （若要改，请直接改这个文件 —— 别用宝塔网站列表的「删除」，它带「同时删除站点
#     目录」选项，勾上会连 /www/wwwroot/rxt/www 一起删掉。）
#
# 路径分流：
#   /       → 落地页    frontend-landing（构建时 VITE_PLATFORM_BASE_URL=/app）
#   /app/   → 业务端    frontend-web    （构建时 RXT_BASE=/app/）
#   /admin/ → 管理后台  frontend-admin  （构建时 RXT_BASE=/admin/）
#   /api/   → 反代到后端 127.0.0.1:8081（后端绑回环，外网只能经这里进）
#
# 部署与排障的完整步骤见 docs/部署-腾讯云共享环境.md。

server {
    listen       8080;
    server_name  _;

    root  /www/wwwroot/rxt/www;
    index index.html;
    charset utf-8;

    # 与后端 spring.servlet.multipart.max-request-size 对齐。
    # nginx 默认只有 1MB —— 不改的话传图直接 413，而且后端日志里一条都不会有，
    # 很容易被误判成「前端根本没调接口」。
    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ------------------------------------------------------------------
    # 后端 API
    # proxy_pass 后面**不带路径** ⇒ 原始 URI 原样透传。后端
    # server.servlet.context-path=/api，所以 /api/xxx 正是它的 /xxx。
    # 写成 http://127.0.0.1:8081/（带尾斜杠）会把 /api 前缀替掉、全盘 404。
    # ------------------------------------------------------------------
    location ^~ /api/ {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ------------------------------------------------------------------
    # 带内容哈希的构建产物：可以长期强缓存
    # ------------------------------------------------------------------
    location ^~ /assets/       { expires 1y; add_header Cache-Control "public, immutable"; access_log off; }
    location ^~ /app/assets/   { expires 1y; add_header Cache-Control "public, immutable"; access_log off; }
    location ^~ /admin/assets/ { expires 1y; add_header Cache-Control "public, immutable"; access_log off; }

    # ------------------------------------------------------------------
    # 三个 SPA 的入口页：不能缓存
    # index.html 是外壳，里面引用的哈希资源每次发版都换名。一旦被强缓存，
    # 用户会拿旧壳去请求早已被删掉的旧资源 ⇒ 整页白屏，刷新也没用。
    # ------------------------------------------------------------------
    location = /index.html       { add_header Cache-Control "no-cache"; }
    location = /app/index.html   { add_header Cache-Control "no-cache"; }
    location = /admin/index.html { add_header Cache-Control "no-cache"; }

    # ------------------------------------------------------------------
    # 前端素材目录：必须写在 SPA 回退**之前**，且刻意不写 try_files
    #
    # 三个 SPA 的回退都是 `try_files $uri $uri/ /index.html`，它把「文件不存在」
    # 也变成一次**成功的响应**（200 + text/html + index.html）。浏览器拿到 HTML
    # 却解不出图，只留下「图片静默变成商品名首字色块、页面不报错、控制台也干净」
    # 这一种极难定位的现象。
    #
    # 判据：**`200` + `Content-Type: text/html` + 响应体 1045 字节（index.html 的
    # 大小）就是命中回退** —— 光看状态码看不出来。
    #
    # 这里不写 try_files ⇒ 文件真不存在时老实 404，配置错了当场暴露。
    # 前缀匹配是「从头匹配」，所以不会影响 /app/ 下的同名路径
    # （`/app/products/x` 命中的是更长的 `^~ /app/`）。
    # ------------------------------------------------------------------
    location ^~ /products/  { access_log off; }
    location ^~ /experts/   { access_log off; }
    location ^~ /knowledge/ { access_log off; }

    # ------------------------------------------------------------------
    # 三个 SPA 的路由回退
    # 前端是 history 模式路由，直接访问 /app/trade/products 时磁盘上没有这个文件，
    # 必须回退到各自的 index.html，由前端路由自己解析。
    # ------------------------------------------------------------------
    location ^~ /app/   { try_files $uri $uri/ /app/index.html; }
    location ^~ /admin/ { try_files $uri $uri/ /admin/index.html; }
    location /          { try_files $uri $uri/ /index.html; }
}
