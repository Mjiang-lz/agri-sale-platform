<svg viewBox="0 0 970 780" width="1940" height="1560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>融销通平台系统架构分层图</title>
<desc>融销通平台系统总体架构分层图：前端应用经 HTTP/REST 调用后端，后端自上而下分为表现层（Controller）、业务逻辑层（Service，内含推荐构件）、数据访问层（Mapper）三层，向下依赖 MySQL 与对象存储；业务逻辑层经模拟通道调用第三方支付与短信服务；公共支撑层（common / config / security）被各层共用。</desc>
<rect x="0" y="0" width="970" height="780" fill="#FFFFFF"/>
<defs>
<marker id="ldep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1 L9 5 L2 9" fill="none" stroke="#444441" stroke-width="1.3" stroke-linecap="round"/>
</marker>
</defs>

<rect x="40" y="40" width="300" height="68" fill="#FFFFFF" stroke="#444441" stroke-width="0.8"/>
<text x="190" y="64" font-size="9.5" fill="#5F5E5A" text-anchor="middle">«component» 前端应用</text>
<text x="190" y="84" font-size="12.5" font-weight="500" fill="#2C2C2A" text-anchor="middle">Vue.js 3.x ＋ Element Plus</text>
<text x="190" y="101" font-size="9.5" fill="#5F5E5A" text-anchor="middle">业务端页面 · 管理后台</text>

<path d="M190 108 V146" fill="none" stroke="#444441" stroke-width="0.9" marker-end="url(#ldep)"/>
<text x="200" y="132" font-size="9.5" fill="#5F5E5A">HTTP / REST · JSON</text>

<rect x="40" y="150" width="700" height="84" fill="#FFFFFF" stroke="#444441" stroke-width="0.9"/>
<text x="62" y="180" font-size="12.5" font-weight="500" fill="#2C2C2A">表现层</text>
<text x="122" y="180" font-size="10" fill="#888780">Controller</text>
<text x="62" y="200" font-size="9.5" fill="#5F5E5A">com.rxt.*.controller</text>
<text x="62" y="220" font-size="9.5" fill="#5F5E5A">接收 HTTP 请求 · 参数校验 · 调用服务层 · 返回统一响应结果（VO）</text>

<path d="M390 234 V260" fill="none" stroke="#444441" stroke-width="0.9" marker-end="url(#ldep)"/>
<text x="400" y="252" font-size="9.5" fill="#5F5E5A">调用</text>

<rect x="40" y="264" width="700" height="124" fill="#F1EFE8" stroke="#444441" stroke-width="0.9"/>
<text x="62" y="294" font-size="12.5" font-weight="500" fill="#2C2C2A">业务逻辑层</text>
<text x="132" y="294" font-size="10" fill="#888780">Service</text>
<text x="62" y="314" font-size="9.5" fill="#5F5E5A">com.rxt.*.service</text>
<text x="62" y="334" font-size="9.5" fill="#5F5E5A">业务规则 · 事务控制 · 权限校验 · 层间以 DTO 传递数据</text>
<rect x="460" y="340" width="260" height="40" rx="2" fill="#E6F1FB" stroke="#444441" stroke-width="0.7"/>
<text x="590" y="356" font-size="10" fill="#0C447C" text-anchor="middle">«component» 推荐构件</text>
<text x="590" y="372" font-size="9" fill="#185FA5" text-anchor="middle">联合融资人智能推荐（基于内容的推荐算法）</text>

<path d="M390 388 V414" fill="none" stroke="#444441" stroke-width="0.9" marker-end="url(#ldep)"/>
<text x="400" y="406" font-size="9.5" fill="#5F5E5A">调用</text>

<rect x="40" y="418" width="700" height="84" fill="#F1EFE8" stroke="#444441" stroke-width="0.9"/>
<text x="62" y="448" font-size="12.5" font-weight="500" fill="#2C2C2A">数据访问层</text>
<text x="142" y="448" font-size="10" fill="#888780">Mapper</text>
<text x="62" y="468" font-size="9.5" fill="#5F5E5A">com.rxt.*.mapper</text>
<text x="62" y="488" font-size="9.5" fill="#5F5E5A">持久化映射 · 单表 CRUD · 条件查询 · Entity 与数据库表一一映射</text>

<path d="M390 502 V528" fill="none" stroke="#444441" stroke-width="0.9" marker-end="url(#ldep)"/>
<text x="400" y="520" font-size="9.5" fill="#5F5E5A">持久化</text>

<rect x="40" y="532" width="340" height="86" fill="#FFFFFF" stroke="#444441" stroke-width="0.8"/>
<text x="62" y="560" font-size="12.5" font-weight="500" fill="#2C2C2A">MySQL 8.0</text>
<text x="62" y="580" font-size="9.5" fill="#5F5E5A">业务数据表：t_user / t_order /</text>
<text x="62" y="596" font-size="9.5" fill="#5F5E5A">t_finance_apply 等</text>

<rect x="400" y="532" width="340" height="86" fill="#FFFFFF" stroke="#444441" stroke-width="0.8"/>
<text x="422" y="560" font-size="12.5" font-weight="500" fill="#2C2C2A">对象存储</text>
<text x="422" y="580" font-size="9.5" fill="#5F5E5A">商品图片 · 知识配图</text>
<text x="422" y="596" font-size="9.5" fill="#5F5E5A">用户头像 · 资质证明</text>

<text x="850" y="252" font-size="10" fill="#5F5E5A" text-anchor="middle">模拟外部通道</text>

<rect x="770" y="264" width="160" height="56" fill="#FFFFFF" stroke="#444441" stroke-width="0.8"/>
<text x="850" y="282" font-size="9" fill="#5F5E5A" text-anchor="middle">«component»</text>
<text x="850" y="299" font-size="11" font-weight="500" fill="#2C2C2A" text-anchor="middle">第三方支付</text>
<text x="850" y="314" font-size="9" fill="#5F5E5A" text-anchor="middle">模拟通道</text>

<rect x="770" y="332" width="160" height="56" fill="#FFFFFF" stroke="#444441" stroke-width="0.8"/>
<text x="850" y="350" font-size="9" fill="#5F5E5A" text-anchor="middle">«component»</text>
<text x="850" y="367" font-size="11" font-weight="500" fill="#2C2C2A" text-anchor="middle">短信服务</text>
<text x="850" y="382" font-size="9" fill="#5F5E5A" text-anchor="middle">模拟通道</text>

<path d="M740 292 H766" fill="none" stroke="#444441" stroke-width="0.9" stroke-dasharray="5 4" marker-end="url(#ldep)"/>
<path d="M740 360 H766" fill="none" stroke="#444441" stroke-width="0.9" stroke-dasharray="5 4" marker-end="url(#ldep)"/>

<rect x="40" y="646" width="890" height="64" fill="#F1EFE8" stroke="#444441" stroke-width="0.9"/>
<text x="62" y="674" font-size="12.5" font-weight="500" fill="#2C2C2A">公共支撑层</text>
<text x="152" y="674" font-size="10" fill="#888780">被各层共用</text>
<text x="62" y="694" font-size="9.5" fill="#5F5E5A">common 统一返回 · 全局异常 · 通用工具　│　config 配置类与拦截器　│　security 认证与权限</text>

<text x="40" y="738" font-size="10.5" fill="#5F5E5A">说明：自上而下单向依赖，上层只能调用其相邻下层，禁止跨层调用与反向依赖；层间以 DTO 传递数据、对外以 VO 返回、Entity 与数据库表一一映射。</text>
<text x="40" y="756" font-size="10.5" fill="#5F5E5A">　　　公共支撑层被各层共用；第三方支付与短信服务为模拟通道，不涉及真实资金（与 SRS 技术口径一致）。</text>
</svg>
