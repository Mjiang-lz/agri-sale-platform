<text x="252" y="196" font-size="10" fill="#5F5E5A">聚合展示</text>
<text x="482" y="196" font-size="10" fill="#5F5E5A" text-anchor="middle">«access» 读取交易行为数据</text>
<text x="616" y="240" font-size="10" fill="#5F5E5A">«import» 读取融资申请</text>
<text x="380" y="246" font-size="10" fill="#5F5E5A" text-anchor="end">«access» 我的发布</text>
<text x="212" y="414" font-size="10" fill="#5F5E5A" text-anchor="middle">«import»</text>
<text x="440" y="414" font-size="10" fill="#5F5E5A" text-anchor="middle">«import»</text>
<text x="428" y="392" font-size="10" fill="#5F5E5A" text-anchor="end">«import» 权限校验</text>

<text x="40" y="556" font-size="10.5" fill="#5F5E5A">说明：包按业务模块划分，虚线箭头表示包之间的依赖，箭头指向被依赖的包；全部业务包均依赖公共包，为图面清晰仅示出主要依赖。</text>
