<svg viewBox="0 0 970 580" width="1940" height="1160" role="img" xmlns="http://www.w3.org/2000/svg">
<title>融销通平台系统包图</title>
<desc>融销通平台逻辑包结构：第一行为用户与认证、农产品交易、融资服务、专家助力四个业务包，第二行为首页、个人信息、融资管理，第三行为公共工具、配置、安全与权限三个公共包；虚线箭头表示包之间的依赖关系</desc>
<rect x="0" y="0" width="970" height="580" fill="#FFFFFF"/>
<defs>
