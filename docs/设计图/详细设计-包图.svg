<path d="M2 1 L9 5 L2 9" fill="none" stroke="#444441" stroke-width="1.3" stroke-linecap="round"/>
</marker>
</defs>

<rect x="40" y="84" width="60" height="14" fill="#F1EFE8" stroke="#444441" stroke-width="0.7"/>
