<rect x="650" y="175" width="280" height="80" fill="#FFFFFF" stroke="#444441" stroke-width="0.8"/>
<rect x="662" y="189" width="22" height="16" fill="none" stroke="#444441" stroke-width="0.7"/>
<rect x="656" y="193" width="10" height="4" fill="none" stroke="#444441" stroke-width="0.7"/>
<rect x="656" y="201" width="10" height="4" fill="none" stroke="#444441" stroke-width="0.7"/>
<text x="692" y="201" font-size="9.5" fill="#5F5E5A">«component»</text>
<text x="692" y="221" font-size="12.5" font-weight="500" fill="#2C2C2A">对象存储</text>
