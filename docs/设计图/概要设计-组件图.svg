<text x="692" y="336" font-size="12.5" font-weight="500" fill="#2C2C2A">第三方支付</text>
<text x="692" y="354" font-size="9.5" fill="#5F5E5A">模拟通道，不涉及真实资金</text>

<rect x="650" y="405" width="280" height="80" fill="#FFFFFF" stroke="#444441" stroke-width="0.8"/>
<rect x="662" y="419" width="22" height="16" fill="none" stroke="#444441" stroke-width="0.7"/>
<rect x="656" y="423" width="10" height="4" fill="none" stroke="#444441" stroke-width="0.7"/>
<rect x="656" y="431" width="10" height="4" fill="none" stroke="#444441" stroke-width="0.7"/>
<text x="692" y="431" font-size="9.5" fill="#5F5E5A">«component»</text>
<text x="692" y="451" font-size="12.5" font-weight="500" fill="#2C2C2A">短信服务</text>
<text x="692" y="469" font-size="9.5" fill="#5F5E5A">模拟通道，发送验证码与通知</text>

<circle cx="296" cy="130" r="4.5" fill="#FFFFFF" stroke="#444441" stroke-width="0.8"/>
<path d="M300 130 H334" fill="none" stroke="#444441" stroke-width="0.9" marker-end="url(#cdep)"/>
<text x="316" y="121" font-size="9.5" fill="#5F5E5A" text-anchor="middle">REST</text>

<circle cx="594" cy="100" r="4.5" fill="#FFFFFF" stroke="#444441" stroke-width="0.8"/>
<path d="M598 100 H644" fill="none" stroke="#444441" stroke-width="0.9" marker-end="url(#cdep)"/>
<text x="621" y="91" font-size="10" fill="#5F5E5A" text-anchor="middle">数据访问</text>

<circle cx="594" cy="215" r="4.5" fill="#FFFFFF" stroke="#444441" stroke-width="0.8"/>
<path d="M598 215 H644" fill="none" stroke="#444441" stroke-width="0.9" marker-end="url(#cdep)"/>
