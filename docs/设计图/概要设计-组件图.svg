<text x="80" y="159" font-size="10" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">业务端页面</text>
<rect x="125" y="146" width="70" height="26" rx="2" fill="#F1EFE8" stroke="#444441" stroke-width="0.6"/>
<text x="160" y="159" font-size="10" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">管理后台</text>
<rect x="205" y="146" width="70" height="26" rx="2" fill="#F1EFE8" stroke="#444441" stroke-width="0.6"/>
<text x="240" y="159" font-size="10" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">公共组件</text>

<rect x="340" y="60" width="250" height="440" fill="#FFFFFF" stroke="#444441" stroke-width="0.8"/>
