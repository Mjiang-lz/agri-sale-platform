<text x="30" y="536" font-size="10.5" fill="#5F5E5A">说明：圆角外框与内部小方块均为 «component» 构件；后端应用右侧的圆点为对外提供的接口，箭头表示依赖方向，接口名称标注在箭头旁。</text>
