<svg viewBox="0 0 970 560" width="1940" height="1120" role="img" xmlns="http://www.w3.org/2000/svg">
<title>融销通平台系统组件图</title>
<desc>融销通平台实现视图组件图：前端应用（Vue.js 3.x）通过 REST 接口依赖后端应用（Spring Boot 4.x），后端应用内含七个业务构件与 AI 推荐构件，并通过数据访问、文件存储、支付结算、短信通道四个接口依赖数据库、对象存储与两个模拟外部通道构件</desc>
<rect x="0" y="0" width="970" height="560" fill="#FFFFFF"/>
<defs>
<marker id="cdep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1 L9 5 L2 9" fill="none" stroke="#444441" stroke-width="1.3" stroke-linecap="round"/>
</marker>
</defs>

<rect x="30" y="60" width="260" height="140" fill="#FFFFFF" stroke="#444441" stroke-width="0.8"/>
<rect x="42" y="74" width="22" height="16" fill="none" stroke="#444441" stroke-width="0.7"/>
