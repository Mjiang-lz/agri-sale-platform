<svg viewBox="0 0 920 700" width="1840" height="1400" role="img" xmlns="http://www.w3.org/2000/svg">
<title>融销通平台下单与第三方担保结算顺序图</title>
<desc>参与对象为采购方、融销通平台、第三方支付模拟通道与农户；含同步消息、自调用与异步回调消息，展示下单、担保支付、发货、收货与结算划付的完整交互</desc>

<defs>
<marker id="arrowFill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1 L9 5 L1 9 z" fill="#444441"/>
</marker>
<marker id="arrowOpen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1 L9 5 L2 9" fill="none" stroke="#A32D2D" stroke-width="1.3" stroke-linecap="round"/>
</marker>
</defs>
<rect x="0" y="0" width="920" height="700" fill="#FFFFFF"/>
<rect x="30" y="30" width="860" height="630" fill="none" stroke="#444441" stroke-width="0.8"/>
<path d="M30 30 h96 l14 16 h-110 z" fill="#F1EFE8" stroke="#444441" stroke-width="0.8"/>
<text x="40" y="43" font-size="11.5" font-weight="500" fill="#2C2C2A">sd 下单与第三方担保结算</text>
<rect x="45" y="58" width="130" height="42" rx="2" fill="#FFFFFF" stroke="#444441" stroke-width="0.7"/>
<text x="110" y="79" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">采购方</text>
<text x="110" y="93" font-size="9.5" fill="#5F5E5A" text-anchor="middle">参与者</text>
<path d="M110 100 V642" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="5 5"/>
<rect x="275" y="58" width="130" height="42" rx="2" fill="#FFFFFF" stroke="#444441" stroke-width="0.7"/>
<text x="340" y="79" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">融销通平台</text>
<text x="340" y="93" font-size="9.5" fill="#5F5E5A" text-anchor="middle">Spring Boot 4.x</text>
<path d="M340 100 V642" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="5 5"/>
<rect x="505" y="58" width="130" height="42" rx="2" fill="#FFFFFF" stroke="#444441" stroke-width="0.7"/>
<text x="570" y="79" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">第三方支付（模拟）</text>
<text x="570" y="93" font-size="9.5" fill="#5F5E5A" text-anchor="middle">外部模拟接口</text>
<path d="M570 100 V642" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="5 5"/>
<rect x="735" y="58" width="130" height="42" rx="2" fill="#FFFFFF" stroke="#444441" stroke-width="0.7"/>
<text x="800" y="79" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">农户</text>
<text x="800" y="93" font-size="9.5" fill="#5F5E5A" text-anchor="middle">参与者</text>
<path d="M800 100 V642" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="5 5"/>
<rect x="105" y="124" width="10" height="22" fill="#F1EFE8" stroke="#444441" stroke-width="0.6"/>
<rect x="105" y="414" width="10" height="22" fill="#F1EFE8" stroke="#444441" stroke-width="0.6"/>
<rect x="105" y="454" width="10" height="22" fill="#F1EFE8" stroke="#444441" stroke-width="0.6"/>
<rect x="335" y="124" width="10" height="496" fill="#F1EFE8" stroke="#444441" stroke-width="0.6"/>
<rect x="565" y="208" width="10" height="56" fill="#F1EFE8" stroke="#444441" stroke-width="0.6"/>
<rect x="565" y="334" width="10" height="22" fill="#F1EFE8" stroke="#444441" stroke-width="0.6"/>
<rect x="565" y="496" width="10" height="56" fill="#F1EFE8" stroke="#444441" stroke-width="0.6"/>
<rect x="795" y="374" width="10" height="22" fill="#F1EFE8" stroke="#444441" stroke-width="0.6"/>
<path d="M110 130 H334" fill="none" stroke="#444441" stroke-width="1" marker-end="url(#arrowFill)"/>
<text x="225" y="124" font-size="10.5" fill="#2C2C2A" text-anchor="middle">1 提交订单（商品、数量）</text>
<path d="M345 176 h58 v24 h-58" fill="none" stroke="#444441" stroke-width="1" marker-end="url(#arrowFill)"/>
<text x="410" y="186" font-size="10.5" fill="#2C2C2A">2 校验商品状态与库存</text>
<path d="M340 222 H564" fill="none" stroke="#444441" stroke-width="1" marker-end="url(#arrowFill)"/>
<text x="455" y="216" font-size="10.5" fill="#2C2C2A" text-anchor="middle">3 发起担保支付（订单金额）</text>
<path d="M570 262 H346" fill="none" stroke="#A32D2D" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#arrowOpen)"/>
<text x="455" y="256" font-size="10.5" fill="#2C2C2A" text-anchor="middle">4 返回支付受理结果</text>
<path d="M340 302 H116" fill="none" stroke="#A32D2D" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#arrowOpen)"/>
<text x="225" y="296" font-size="10.5" fill="#2C2C2A" text-anchor="middle">5 返回下单结果</text>
<path d="M570 348 H346" fill="none" stroke="#444441" stroke-width="1" marker-end="url(#arrowFill)"/>
<text x="455" y="342" font-size="10.5" fill="#2C2C2A" text-anchor="middle">6 异步回调支付成功</text>
<path d="M340 388 H794" fill="none" stroke="#444441" stroke-width="1" marker-end="url(#arrowFill)"/>
<text x="570" y="382" font-size="10.5" fill="#2C2C2A" text-anchor="middle">7 推送发货通知</text>
<path d="M800 428 H346" fill="none" stroke="#444441" stroke-width="1" marker-end="url(#arrowFill)"/>
<text x="570" y="422" font-size="10.5" fill="#2C2C2A" text-anchor="middle">8 确认发货</text>
<path d="M110 468 H334" fill="none" stroke="#444441" stroke-width="1" marker-end="url(#arrowFill)"/>
<text x="225" y="462" font-size="10.5" fill="#2C2C2A" text-anchor="middle">9 确认收货</text>
<path d="M340 512 H564" fill="none" stroke="#444441" stroke-width="1" marker-end="url(#arrowFill)"/>
<text x="455" y="506" font-size="10.5" fill="#2C2C2A" text-anchor="middle">10 发起结算放款</text>
<path d="M570 552 H794" fill="none" stroke="#444441" stroke-width="1" marker-end="url(#arrowFill)"/>
<text x="685" y="546" font-size="10.5" fill="#2C2C2A" text-anchor="middle">11 划付货款</text>
<path d="M345 596 h58 v24 h-58" fill="none" stroke="#444441" stroke-width="1" marker-end="url(#arrowFill)"/>
<text x="410" y="606" font-size="10.5" fill="#2C2C2A">12 沉淀交易与行为数据</text>
<path d="M340 636 H116" fill="none" stroke="#A32D2D" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#arrowOpen)"/>
<text x="225" y="630" font-size="10.5" fill="#2C2C2A" text-anchor="middle">13 返回订单完成状态</text>
<text x="30" y="678" font-size="10.5" fill="#5F5E5A">说明：实线实心箭头为同步消息，虚线箭头为返回消息，自调用以折线回路表示，生命线上的细长矩形为激活条；消息自 1 起顺序编号。</text>
</svg>
