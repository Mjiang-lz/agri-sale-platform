<text x="36" y="628" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" text-anchor="start" fill="#5A6B78">说明：三维盒体为 «device» 部署节点（物理机 / 云主机，按 UML 定义只标注硬件规格）；浅黄盒体为 «executionEnvironment» 运行环境（操作系统 + 中间件）。</text>
<text x="36" y="646" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" text-anchor="start" fill="#5A6B78">白色文档块为 «artifact» 部署制品；节点间实线为 «communicationPath» 通信路径（旁注协议与端口），虚线为 «deploy» 部署依赖，表示 CodeArts 构建后把制品部署到应用服务器。</text>
<text x="36" y="664" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" text-anchor="start" fill="#5A6B78">用户终端与管理终端均通过浏览器访问、无需安装客户端；服务端配置对齐 SRS「x86_64、4 核 8GB 内存起、磁盘 100GB 起」。</text>
<text x="36" y="682" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" text-anchor="start" fill="#5A6B78">第三方支付与短信为模拟通道，不涉及真实资金。</text>
