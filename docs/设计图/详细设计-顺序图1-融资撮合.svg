<svg viewBox="0 0 920 780" width="1840" height="1560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>融销通平台联合融资智能匹配与推送顺序图</title>
<desc>参与对象为农户、融销通平台、推荐服务与银行用户；消息自 1 起编号，含平台与推荐服务的自调用、推荐结果的返回消息，以及以 alt 选择分支表示融资审核通过与否两种处理路径</desc>

<defs>
<marker id="arrowFill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1 L9 5 L1 9 z" fill="#444441"/>
</marker>
<marker id="arrowOpen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1 L9 5 L2 9" fill="none" stroke="#A32D2D" stroke-width="1.3" stroke-linecap="round"/>
</marker>
</defs>
<rect x="0" y="0" width="920" height="780" fill="#FFFFFF"/>
<rect x="30" y="30" width="860" height="710" fill="none" stroke="#444441" stroke-width="0.8"/>
<path d="M30 30 h96 l14 16 h-110 z" fill="#F1EFE8" stroke="#444441" stroke-width="0.8"/>
<text x="40" y="43" font-size="11.5" font-weight="500" fill="#2C2C2A">sd 联合融资智能匹配与推送银行</text>
<rect x="45" y="58" width="130" height="42" rx="2" fill="#FFFFFF" stroke="#444441" stroke-width="0.7"/>
<text x="110" y="79" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">农户</text>
<text x="110" y="93" font-size="9.5" fill="#5F5E5A" text-anchor="middle">参与者</text>
<path d="M110 100 V722" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="5 5"/>
<rect x="275" y="58" width="130" height="42" rx="2" fill="#FFFFFF" stroke="#444441" stroke-width="0.7"/>
<text x="340" y="79" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">融销通平台</text>
<text x="340" y="93" font-size="9.5" fill="#5F5E5A" text-anchor="middle">Spring Boot 4.x</text>
<path d="M340 100 V722" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="5 5"/>
<rect x="505" y="58" width="130" height="42" rx="2" fill="#FFFFFF" stroke="#444441" stroke-width="0.7"/>
<text x="570" y="79" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">推荐服务</text>
<text x="570" y="93" font-size="9.5" fill="#5F5E5A" text-anchor="middle">基于内容的推荐算法</text>
<path d="M570 100 V722" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="5 5"/>
<rect x="735" y="58" width="130" height="42" rx="2" fill="#FFFFFF" stroke="#444441" stroke-width="0.7"/>
<text x="800" y="79" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">银行用户</text>
<text x="800" y="93" font-size="9.5" fill="#5F5E5A" text-anchor="middle">系统角色关联</text>
<path d="M800 100 V722" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="5 5"/>
<rect x="105" y="124" width="10" height="22" fill="#F1EFE8" stroke="#444441" stroke-width="0.6"/>
<rect x="105" y="374" width="10" height="22" fill="#F1EFE8" stroke="#444441" stroke-width="0.6"/>
<rect x="105" y="608" width="10" height="22" fill="#F1EFE8" stroke="#444441" stroke-width="0.6"/>
<rect x="105" y="692" width="10" height="22" fill="#F1EFE8" stroke="#444441" stroke-width="0.6"/>
<rect x="335" y="124" width="10" height="602" fill="#F1EFE8" stroke="#444441" stroke-width="0.6"/>
<rect x="565" y="208" width="10" height="98" fill="#F1EFE8" stroke="#444441" stroke-width="0.6"/>
<rect x="795" y="454" width="10" height="58" fill="#F1EFE8" stroke="#444441" stroke-width="0.6"/>
<rect x="795" y="572" width="10" height="20" fill="#F1EFE8" stroke="#444441" stroke-width="0.6"/>
<rect x="795" y="662" width="10" height="20" fill="#F1EFE8" stroke="#444441" stroke-width="0.6"/>
<rect x="60" y="528" width="820" height="204" fill="none" stroke="#444441" stroke-width="0.8"/>
<path d="M60 528 h52 l12 15 h-64 z" fill="#FAEEDA" stroke="#444441" stroke-width="0.8"/>
<text x="69" y="540.5" font-size="10.5" font-weight="500" fill="#633806">alt</text>
<text x="68" y="567" font-size="10.5" fill="#5F5E5A">［审核通过］</text>
<path d="M60 648 H880" fill="none" stroke="#444441" stroke-width="0.7" stroke-dasharray="5 4"/>
<text x="68" y="663" font-size="10.5" fill="#5F5E5A">［审核未通过］</text>
<path d="M110 130 H334" fill="none" stroke="#444441" stroke-width="1" marker-end="url(#arrowFill)"/>
<text x="225" y="124" font-size="10.5" fill="#2C2C2A" text-anchor="middle">1 提交融资申请（额度、用途、期限）</text>
<path d="M345 176 h58 v24 h-58" fill="none" stroke="#444441" stroke-width="1" marker-end="url(#arrowFill)"/>
<text x="410" y="186" font-size="10.5" fill="#2C2C2A">2 校验主体资质与申请信息</text>
<path d="M340 222 H564" fill="none" stroke="#444441" stroke-width="1" marker-end="url(#arrowFill)"/>
<text x="455" y="216" font-size="10.5" fill="#2C2C2A" text-anchor="middle">3 请求匹配相似农户</text>
<path d="M575 268 h58 v24 h-58" fill="none" stroke="#444441" stroke-width="1" marker-end="url(#arrowFill)"/>
<text x="640" y="278" font-size="10.5" fill="#2C2C2A">4 计算经营特征相似度</text>
<path d="M570 314 H346" fill="none" stroke="#A32D2D" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#arrowOpen)"/>
<text x="455" y="308" font-size="10.5" fill="#2C2C2A" text-anchor="middle">5 返回候选农户与匹配度</text>
<path d="M340 352 H116" fill="none" stroke="#444441" stroke-width="1" marker-end="url(#arrowFill)"/>
<text x="225" y="346" font-size="10.5" fill="#2C2C2A" text-anchor="middle">6 推送组队邀请</text>
<path d="M110 392 H334" fill="none" stroke="#444441" stroke-width="1" marker-end="url(#arrowFill)"/>
<text x="225" y="386" font-size="10.5" fill="#2C2C2A" text-anchor="middle">7 确认加入联合贷款小组</text>
<path d="M345 436 h58 v24 h-58" fill="none" stroke="#444441" stroke-width="1" marker-end="url(#arrowFill)"/>
<text x="410" y="446" font-size="10.5" fill="#2C2C2A">8 组建小组并写入农户档案</text>
<path d="M340 472 H794" fill="none" stroke="#444441" stroke-width="1" marker-end="url(#arrowFill)"/>
<text x="570" y="466" font-size="10.5" fill="#2C2C2A" text-anchor="middle">9 推送小组与农户档案</text>
<path d="M800 512 H346" fill="none" stroke="#A32D2D" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#arrowOpen)"/>
<text x="570" y="506" font-size="10.5" fill="#2C2C2A" text-anchor="middle">10 返回受理结果</text>
<path d="M800 586 H346" fill="none" stroke="#444441" stroke-width="1" marker-end="url(#arrowFill)"/>
<text x="570" y="580" font-size="10.5" fill="#2C2C2A" text-anchor="middle">11 回传放款结果</text>
<path d="M340 624 H116" fill="none" stroke="#444441" stroke-width="1" marker-end="url(#arrowFill)"/>
<text x="225" y="618" font-size="10.5" fill="#2C2C2A" text-anchor="middle">12 通知放款到账</text>
<path d="M800 678 H346" fill="none" stroke="#444441" stroke-width="1" marker-end="url(#arrowFill)"/>
<text x="570" y="672" font-size="10.5" fill="#2C2C2A" text-anchor="middle">13 反馈未通过原因</text>
<path d="M340 710 H116" fill="none" stroke="#444441" stroke-width="1" marker-end="url(#arrowFill)"/>
<text x="225" y="704" font-size="10.5" fill="#2C2C2A" text-anchor="middle">14 通知退回重新匹配</text>
<text x="30" y="758" font-size="10.5" fill="#5F5E5A">说明：实线实心箭头为同步消息，虚线箭头为返回消息，自调用以折线回路表示，生命线上的细长矩形为激活条；消息自 1 起顺序编号，“alt”为选择分支。</text>
</svg>
