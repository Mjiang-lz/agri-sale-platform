<svg viewBox="0 0 970 780" width="1940" height="1560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>融销通平台系统包图（按技术分层划分）</title>
<desc>融销通平台按技术分层组织的包结构：com.rxt 下分 controller、service、mapper、entity 四个主链路包与 vo、dto 两个数据载体包，以及 config、common、security 三个公共包，共 9 个直接子包；层间单向依赖 controller → service → mapper → entity。</desc>
<rect x="0" y="0" width="970" height="780" fill="#FFFFFF"/>
<defs>
<marker id="pdep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1 L9 5 L2 9" fill="none" stroke="#444441" stroke-width="1.3" stroke-linecap="round"/>
</marker>
</defs>

<text x="40" y="58" font-size="13" font-weight="500" fill="#2C2C2A">«package» com.rxt</text>
<text x="196" y="58" font-size="9.5" fill="#5F5E5A">按技术分层划分的 9 个直接子包</text>

<rect x="40" y="110" width="60" height="14" fill="#E6E4DC" stroke="#444441" stroke-width="0.7"/>
<rect x="40" y="124" width="540" height="104" fill="#F1EFE8" stroke="#444441" stroke-width="0.9"/>
<text x="62" y="146" font-size="12.5" font-weight="500" fill="#2C2C2A">controller</text>
<text x="150" y="146" font-size="9.5" fill="#888780">表现层</text>
<text x="62" y="164" font-size="9" fill="#888780">com.rxt.controller</text>
<text x="62" y="184" font-size="9.5" fill="#5F5E5A">AuthController · HomeController · FinanceController</text>
<text x="62" y="200" font-size="9.5" fill="#5F5E5A">TradeController · ExpertController · UserController</text>
<text x="62" y="216" font-size="9.5" fill="#5F5E5A">LoanAdminController（银行侧融资管理）</text>

<rect x="40" y="256" width="60" height="14" fill="#E6E4DC" stroke="#444441" stroke-width="0.7"/>
<rect x="40" y="270" width="540" height="104" fill="#F1EFE8" stroke="#444441" stroke-width="0.9"/>
<text x="62" y="292" font-size="12.5" font-weight="500" fill="#2C2C2A">service</text>
<text x="134" y="292" font-size="9.5" fill="#888780">业务逻辑层</text>
<text x="62" y="310" font-size="9" fill="#888780">com.rxt.service</text>
<text x="62" y="330" font-size="9.5" fill="#5F5E5A">AuthService · HomeService · FinanceService · RecommendService</text>
<text x="62" y="346" font-size="9.5" fill="#5F5E5A">TradeService · ExpertService · UserService · LoanAdminService</text>
<text x="62" y="362" font-size="9.5" fill="#5F5E5A">另有 service.impl 子包存放接口实现类</text>

<rect x="40" y="402" width="60" height="14" fill="#E6E4DC" stroke="#444441" stroke-width="0.7"/>
<rect x="40" y="416" width="540" height="104" fill="#F1EFE8" stroke="#444441" stroke-width="0.9"/>
<text x="62" y="438" font-size="12.5" font-weight="500" fill="#2C2C2A">mapper</text>
<text x="130" y="438" font-size="9.5" fill="#888780">数据访问层</text>
<text x="62" y="456" font-size="9" fill="#888780">com.rxt.mapper</text>
<text x="62" y="476" font-size="9.5" fill="#5F5E5A">UserMapper · ProductMapper · OrderMapper · DemandMapper</text>
<text x="62" y="492" font-size="9.5" fill="#5F5E5A">FinanceApplyMapper · ExpertQaMapper · KnowledgeMapper</text>
<text x="62" y="508" font-size="9.5" fill="#5F5E5A">…（与 entity 包中的实体类一一对应）</text>

<rect x="40" y="548" width="60" height="14" fill="#E6E4DC" stroke="#444441" stroke-width="0.7"/>
<rect x="40" y="562" width="540" height="126" fill="#F1EFE8" stroke="#444441" stroke-width="0.9"/>
<text x="62" y="584" font-size="12.5" font-weight="500" fill="#2C2C2A">entity</text>
<text x="124" y="584" font-size="9.5" fill="#888780">持久化实体 · 共 18 个（见图 4 类图）</text>
<text x="62" y="602" font-size="9" fill="#888780">com.rxt.entity（持久化实体，与数据库表一一映射）</text>
<text x="62" y="622" font-size="9.5" fill="#5F5E5A">User · FarmerProfile · Role · AuditRecord</text>
<text x="62" y="638" font-size="9.5" fill="#5F5E5A">Product · Order · Demand · Cart · Comment</text>
<text x="62" y="654" font-size="9.5" fill="#5F5E5A">LoanProduct · FinanceApply · LoanGroup · Approval</text>
<text x="62" y="670" font-size="9.5" fill="#5F5E5A">ExpertInfo · Knowledge · Question · Answer · Appointment</text>

<rect x="650" y="110" width="60" height="14" fill="#D6E6F7" stroke="#444441" stroke-width="0.7"/>
<rect x="650" y="124" width="280" height="104" fill="#E6F1FB" stroke="#444441" stroke-width="0.9"/>
<text x="672" y="146" font-size="12.5" font-weight="500" fill="#0C447C">vo</text>
<text x="706" y="146" font-size="9.5" fill="#185FA5">视图输出对象</text>
<text x="672" y="164" font-size="9" fill="#185FA5">com.rxt.vo</text>
<text x="672" y="184" font-size="9.5" fill="#185FA5">UserVO · ProductVO · OrderVO</text>
<text x="672" y="200" font-size="9.5" fill="#185FA5">FinanceApplyVO · ExpertQaVO</text>
<text x="672" y="216" font-size="9.5" fill="#185FA5">…（由 controller 返回前端）</text>

<rect x="650" y="256" width="60" height="14" fill="#D6E6F7" stroke="#444441" stroke-width="0.7"/>
<rect x="650" y="270" width="280" height="104" fill="#E6F1FB" stroke="#444441" stroke-width="0.9"/>
<text x="672" y="292" font-size="12.5" font-weight="500" fill="#0C447C">dto</text>
<text x="714" y="292" font-size="9.5" fill="#185FA5">层间传输对象</text>
<text x="672" y="310" font-size="9" fill="#185FA5">com.rxt.dto</text>
<text x="672" y="330" font-size="9.5" fill="#185FA5">LoginDTO · RegisterDTO</text>
<text x="672" y="346" font-size="9.5" fill="#185FA5">FinanceApplyDTO · OrderCreateDTO</text>
<text x="672" y="362" font-size="9.5" fill="#185FA5">…（层与层之间传递参数）</text>

<rect x="650" y="402" width="60" height="14" fill="#D3D1C7" stroke="#444441" stroke-width="0.7"/>
<rect x="650" y="416" width="280" height="68" fill="#F1EFE8" stroke="#444441" stroke-width="0.9"/>
<text x="672" y="436" font-size="12.5" font-weight="500" fill="#2C2C2A">config</text>
<text x="734" y="436" font-size="9" fill="#888780">配置与拦截器</text>
<text x="672" y="458" font-size="9.5" fill="#5F5E5A">MybatisPlusConfig · WebMvcConfig</text>
<text x="672" y="474" font-size="9.5" fill="#5F5E5A">CorsConfig · 全局拦截器注册</text>

<rect x="650" y="504" width="60" height="14" fill="#D3D1C7" stroke="#444441" stroke-width="0.7"/>
<rect x="650" y="518" width="280" height="68" fill="#F1EFE8" stroke="#444441" stroke-width="0.9"/>
<text x="672" y="538" font-size="12.5" font-weight="500" fill="#2C2C2A">common</text>
<text x="748" y="538" font-size="9" fill="#888780">统一返回与工具</text>
<text x="672" y="560" font-size="9.5" fill="#5F5E5A">Result · PageResult（统一返回）</text>
<text x="672" y="576" font-size="9.5" fill="#5F5E5A">BizException · 通用工具类</text>

<rect x="650" y="606" width="60" height="14" fill="#D3D1C7" stroke="#444441" stroke-width="0.7"/>
<rect x="650" y="620" width="280" height="68" fill="#F1EFE8" stroke="#444441" stroke-width="0.9"/>
<text x="672" y="640" font-size="12.5" font-weight="500" fill="#2C2C2A">security</text>
<text x="748" y="640" font-size="9" fill="#888780">认证与权限</text>
<text x="672" y="662" font-size="9.5" fill="#5F5E5A">JwtFilter · LoginInterceptor</text>
<text x="672" y="678" font-size="9.5" fill="#5F5E5A">PermissionChecker（角色校验）</text>

<path d="M310 228 V252" fill="none" stroke="#444441" stroke-width="0.9" marker-end="url(#pdep)"/>
<text x="322" y="245" font-size="9" fill="#5F5E5A">«import»</text>
<path d="M310 374 V398" fill="none" stroke="#444441" stroke-width="0.9" marker-end="url(#pdep)"/>
<text x="322" y="391" font-size="9" fill="#5F5E5A">«import»</text>
<path d="M310 520 V544" fill="none" stroke="#444441" stroke-width="0.9" marker-end="url(#pdep)"/>
<text x="322" y="537" font-size="9" fill="#5F5E5A">«import»</text>

<path d="M580 169 H646" fill="none" stroke="#444441" stroke-width="0.9" stroke-dasharray="5 4" marker-end="url(#pdep)"/>
<text x="613" y="161" font-size="8.5" fill="#5F5E5A" text-anchor="middle">«access»</text>
<path d="M580 315 H646" fill="none" stroke="#444441" stroke-width="0.9" stroke-dasharray="5 4" marker-end="url(#pdep)"/>
<text x="613" y="307" font-size="8.5" fill="#5F5E5A" text-anchor="middle">«access»</text>

<text x="40" y="726" font-size="10.5" fill="#5F5E5A">说明：本图按技术分层组织包结构，全部类按其在系统中的技术角色归入 9 个包（与按业务模块划分的包图互为对照）。</text>
<text x="40" y="746" font-size="10.5" fill="#5F5E5A">　　　层间单向依赖 controller → service → mapper → entity；dto、vo 被多个层共用；config、common、security 被各层依赖（图中从略）。</text>
</svg>
