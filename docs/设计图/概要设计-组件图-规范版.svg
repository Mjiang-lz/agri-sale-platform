<svg viewBox="0 0 970 600" width="1940" height="1200" role="img" xmlns="http://www.w3.org/2000/svg">
<title>融销通平台系统组件图</title>
<desc>融销通平台实现视图组件图：前端应用包内含 web 前端与管理后台两个组件；应用服务包内含用户与认证、首页、农产品交易、融资服务、专家助力、个人信息、融资管理（银行侧）七个业务构件与一个推荐构件，对外提供业务 REST 接口；数据与外部通道包内含 MySQL、对象存储、第三方支付、短信服务四个组件，分别提供数据访问、文件存储、支付结算、短信通道接口。圆头为 Provided 接口，凹口为 Required 接口，二者成对相连。</desc>
<rect x="0" y="0" width="970" height="600" fill="#FFFFFF"/>
<defs>
<marker id="udep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1 L9 5 L2 9" fill="none" stroke="#444441" stroke-width="1.3" stroke-linecap="round"/>
</marker>
</defs>

<rect x="40" y="44" width="60" height="14" fill="#E3E1D8" stroke="#444441" stroke-width="0.7"/>
<rect x="40" y="58" width="560" height="90" fill="#FAFAF7" stroke="#444441" stroke-width="0.9"/>
<text x="62" y="78" font-size="12.5" font-weight="500" fill="#2C2C2A">前端应用</text>
<text x="126" y="78" font-size="9.5" fill="#888780">«package»　Vue.js 3.x ＋ Element Plus</text>
<rect x="62" y="94" width="242" height="50" fill="#F1EFE8" stroke="#444441" stroke-width="0.7"/>
<text x="80" y="114" font-size="10.5" font-weight="500" fill="#2C2C2A">web前端</text>
<text x="80" y="130" font-size="8.5" fill="#5F5E5A">农户 / 采购方 / 专家 / 银行用户</text>
<rect x="320" y="94" width="242" height="50" fill="#F1EFE8" stroke="#444441" stroke-width="0.7"/>
<text x="338" y="114" font-size="10.5" font-weight="500" fill="#2C2C2A">管理后台</text>
<text x="338" y="130" font-size="8.5" fill="#5F5E5A">平台管理员（审核与内容治理）</text>

<rect x="40" y="188" width="60" height="14" fill="#E3E1D8" stroke="#444441" stroke-width="0.7"/>
<rect x="40" y="202" width="560" height="286" fill="#FAFAF7" stroke="#444441" stroke-width="0.9"/>
<text x="62" y="232" font-size="12.5" font-weight="500" fill="#2C2C2A">应用服务</text>
<text x="126" y="232" font-size="9.5" fill="#888780">«package»　Spring Boot 4.x</text>
<text x="62" y="250" font-size="9" fill="#888780">对外 Provided「业务REST接口」，由内部各业务构件实现（«delegate»）</text>

<rect x="62" y="274" width="242" height="44" fill="#F1EFE8" stroke="#444441" stroke-width="0.7"/>
<text x="80" y="293" font-size="10" font-weight="500" fill="#2C2C2A">用户与认证</text>
<text x="80" y="307" font-size="8.5" fill="#5F5E5A">注册登录 / 实名认证 / 角色权限</text>
<rect x="320" y="274" width="242" height="44" fill="#F1EFE8" stroke="#444441" stroke-width="0.7"/>
<text x="338" y="293" font-size="10" font-weight="500" fill="#2C2C2A">首页</text>
<text x="338" y="307" font-size="8.5" fill="#5F5E5A">信息聚合 / 搜索 / 导航</text>

<rect x="62" y="328" width="242" height="44" fill="#F1EFE8" stroke="#444441" stroke-width="0.7"/>
<text x="80" y="347" font-size="10" font-weight="500" fill="#2C2C2A">农产品交易</text>
<text x="80" y="361" font-size="8.5" fill="#5F5E5A">商品货源 / 求购需求 / 订单</text>
<rect x="320" y="328" width="242" height="44" fill="#F1EFE8" stroke="#444441" stroke-width="0.7"/>
<text x="338" y="347" font-size="10" font-weight="500" fill="#2C2C2A">融资服务</text>
<text x="338" y="361" font-size="8.5" fill="#5F5E5A">融资意向 / 智能匹配 / 申请</text>

<rect x="62" y="382" width="242" height="44" fill="#F1EFE8" stroke="#444441" stroke-width="0.7"/>
<text x="80" y="401" font-size="10" font-weight="500" fill="#2C2C2A">专家助力</text>
<text x="80" y="415" font-size="8.5" fill="#5F5E5A">问答 / 预约 / 知识管理</text>
<rect x="320" y="382" width="242" height="44" fill="#F1EFE8" stroke="#444441" stroke-width="0.7"/>
<text x="338" y="401" font-size="10" font-weight="500" fill="#2C2C2A">个人信息</text>
<text x="338" y="415" font-size="8.5" fill="#5F5E5A">我的发布 / 订单 / 档案等 17 项</text>

<rect x="62" y="436" width="242" height="44" fill="#F1EFE8" stroke="#444441" stroke-width="0.7"/>
<text x="80" y="455" font-size="10" font-weight="500" fill="#2C2C2A">融资管理（银行侧）</text>
<text x="80" y="469" font-size="8.5" fill="#5F5E5A">农户档案 / 审批 / 放款回传</text>
<rect x="320" y="436" width="242" height="44" fill="#E6F1FB" stroke="#444441" stroke-width="0.7"/>
<text x="338" y="455" font-size="10" font-weight="500" fill="#0C447C">推荐构件</text>
<text x="338" y="469" font-size="8.5" fill="#185FA5">基于内容的推荐算法</text>

<path d="M562 350 H578 V458 H563" fill="none" stroke="#444441" stroke-width="0.9" stroke-dasharray="5 4" marker-end="url(#udep)"/>
<text x="566" y="340" font-size="8.5" fill="#5F5E5A">«use»</text>

<rect x="670" y="188" width="60" height="14" fill="#E3E1D8" stroke="#444441" stroke-width="0.7"/>
<rect x="670" y="202" width="260" height="326" fill="#FAFAF7" stroke="#444441" stroke-width="0.9"/>
<text x="692" y="232" font-size="12.5" font-weight="500" fill="#2C2C2A">数据与外部通道</text>
<text x="692" y="250" font-size="9" fill="#888780">«package»　存储与模拟外部通道</text>

<rect x="688" y="264" width="224" height="52" fill="#F1EFE8" stroke="#444441" stroke-width="0.7"/>
<text x="704" y="286" font-size="10" font-weight="500" fill="#2C2C2A">MySQL 8.0</text>
<text x="704" y="301" font-size="8.5" fill="#5F5E5A">业务数据表持久化</text>
<rect x="688" y="328" width="224" height="52" fill="#F1EFE8" stroke="#444441" stroke-width="0.7"/>
<text x="704" y="350" font-size="10" font-weight="500" fill="#2C2C2A">对象存储</text>
<text x="704" y="365" font-size="8.5" fill="#5F5E5A">商品图片 / 知识配图 / 头像</text>
<rect x="688" y="392" width="224" height="52" fill="#F1EFE8" stroke="#444441" stroke-width="0.7"/>
<text x="704" y="414" font-size="10" font-weight="500" fill="#2C2C2A">第三方支付（模拟）</text>
<text x="704" y="429" font-size="8.5" fill="#5F5E5A">不涉及真实资金</text>
<rect x="688" y="456" width="224" height="52" fill="#F1EFE8" stroke="#444441" stroke-width="0.7"/>
<text x="704" y="478" font-size="10" font-weight="500" fill="#2C2C2A">短信服务（模拟）</text>
<text x="704" y="493" font-size="8.5" fill="#5F5E5A">验证码与通知</text>

<path d="M306 148 A6 6 0 0 1 318 148" fill="none" stroke="#444441" stroke-width="1"/>
<path d="M312 154 V176" fill="none" stroke="#444441" stroke-width="0.9"/>
<circle cx="312" cy="182" r="6" fill="#FFFFFF" stroke="#444441" stroke-width="1"/>
<text x="326" y="170" font-size="9.5" fill="#5F5E5A">「业务REST接口」</text>

<path d="M600 284 A6 6 0 0 0 600 296" fill="none" stroke="#444441" stroke-width="1"/>
<path d="M606 290 H678" fill="none" stroke="#444441" stroke-width="0.9"/>
<circle cx="683" cy="290" r="5" fill="#FFFFFF" stroke="#444441" stroke-width="1"/>
<text x="610" y="282" font-size="8.5" fill="#5F5E5A">数据访问接口</text>

<path d="M600 348 A6 6 0 0 0 600 360" fill="none" stroke="#444441" stroke-width="1"/>
<path d="M606 354 H678" fill="none" stroke="#444441" stroke-width="0.9"/>
<circle cx="683" cy="354" r="5" fill="#FFFFFF" stroke="#444441" stroke-width="1"/>
<text x="610" y="346" font-size="8.5" fill="#5F5E5A">文件存储接口</text>

<path d="M600 412 A6 6 0 0 0 600 424" fill="none" stroke="#444441" stroke-width="1"/>
<path d="M606 418 H678" fill="none" stroke="#444441" stroke-width="0.9"/>
<circle cx="683" cy="418" r="5" fill="#FFFFFF" stroke="#444441" stroke-width="1"/>
<text x="610" y="410" font-size="8.5" fill="#5F5E5A">支付结算接口</text>

<path d="M600 476 A6 6 0 0 0 600 488" fill="none" stroke="#444441" stroke-width="1"/>
<path d="M606 482 H678" fill="none" stroke="#444441" stroke-width="0.9"/>
<circle cx="683" cy="482" r="5" fill="#FFFFFF" stroke="#444441" stroke-width="1"/>
<text x="610" y="474" font-size="8.5" fill="#5F5E5A">短信通道接口</text>

<text x="40" y="556" font-size="10.5" fill="#5F5E5A">说明：「package」只用于分组、不参与交互，承担交互的是「component」组件。圆头＝Provided 接口（我提供），凹口＝Required 接口（我需要），两者成对相连。</text>
<text x="40" y="574" font-size="10.5" fill="#5F5E5A">　　　「delegate」表示对外暴露的接口由包内部构件实现；「use」表示构件间调用关系。第三方支付与短信服务为模拟通道，不涉及真实资金。</text>
</svg>
